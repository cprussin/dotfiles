<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640"><rect x="0" y="0" width="800" height="640" rx="0" fill="#07090d"/><defs><linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf" stop-opacity=".22"/><stop offset=".6" stop-color="#0f766e" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="800" height="640" rx="0" fill="url(#bgw)"/><rect x="24" y="24" width="752" height="592" rx="12" fill="#1f232b" stroke="#ffffff" stroke-opacity=".08"/><path d="M24 36a12 12 0 0 1 12-12h728a12 12 0 0 1 12 12v24H24z" fill="#1a1e27"/><circle cx="46" cy="42" r="6" fill="#ff5f57"/><circle cx="66" cy="42" r="6" fill="#febc2e"/><circle cx="86" cy="42" r="6" fill="#28c840"/><g transform="translate(350 32) scale(0.3125)"><defs><linearGradient id="tw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tw)"/><rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".18"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"><ellipse cx="32" cy="32" rx="16" ry="7"/><ellipse cx="32" cy="32" rx="16" ry="7" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="16" ry="7" transform="rotate(120 32 32)"/></g></g><text x="378" y="47" font-family="sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">ChatGPT</text><rect x="24" y="60" width="200" height="556" rx="0" fill="#171a21"/><rect x="40" y="76" width="168" height="34" rx="8" fill="none" stroke="#334155"/><text x="56" y="98" font-family="sans-serif" font-size="14" fill="#e2e8f0">+  New chat</text><text x="40" y="140" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="600">Today</text><rect x="34" y="152" width="180" height="30" rx="6" fill="#262b36"/><text x="46" y="172" font-family="sans-serif" font-size="13" fill="#cbd5e1">Nix flake inputs</text><text x="46" y="206" font-family="sans-serif" font-size="13" fill="#cbd5e1">Sourdough ratios</text><text x="46" y="240" font-family="sans-serif" font-size="13" fill="#cbd5e1">Trip to Lisbon</text><text x="46" y="274" font-family="sans-serif" font-size="13" fill="#cbd5e1">Regex for dates</text><text x="40" y="310" font-family="sans-serif" font-size="12" fill="#64748b" font-weight="600">Yesterday</text><text x="46" y="342" font-family="sans-serif" font-size="13" fill="#94a3b8">Rust lifetimes</text><text x="46" y="376" font-family="sans-serif" font-size="13" fill="#94a3b8">Gift ideas</text><text x="46" y="410" font-family="sans-serif" font-size="13" fill="#94a3b8">SQL window funcs</text><rect x="420" y="90" width="330" height="58" rx="14" fill="#2a2f3a"/><text x="434" y="113" font-family="sans-serif" font-size="14" fill="#f1f5f9">How do I pin a flake input to</text><text x="434" y="133" font-family="sans-serif" font-size="14" fill="#f1f5f9">a specific commit?</text><g transform="translate(250 180) scale(0.4375)"><defs><linearGradient id="cg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cg)"/><rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".18"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"><ellipse cx="32" cy="32" rx="16" ry="7"/><ellipse cx="32" cy="32" rx="16" ry="7" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="16" ry="7" transform="rotate(120 32 32)"/></g></g><text x="292" y="198" font-family="sans-serif" font-size="14" fill="#e2e8f0">Add a rev to the input URL in flake.nix:</text><text x="292" y="220" font-family="sans-serif" font-size="14" fill="#e2e8f0"></text><text x="292" y="242" font-family="sans-serif" font-size="14" fill="#e2e8f0"></text><text x="292" y="264" font-family="sans-serif" font-size="14" fill="#e2e8f0"></text><text x="292" y="286" font-family="sans-serif" font-size="14" fill="#e2e8f0">Then run nix flake lock to update the</text><text x="292" y="308" font-family="sans-serif" font-size="14" fill="#e2e8f0">lock file. You can check the pinned</text><text x="292" y="330" font-family="sans-serif" font-size="14" fill="#e2e8f0">revision with nix flake metadata.</text><rect x="292" y="212" width="440" height="48" rx="8" fill="#0b0d12"/><text x="306" y="241" font-family="monospace" font-size="13" xml:space="preserve"><tspan fill="#93c5fd">inputs.nixpkgs.url = </tspan><tspan fill="#86efac">"github:…/a1b2c3d"</tspan><tspan fill="#e2e8f0">;</tspan></text><rect x="470" y="370" width="280" height="38" rx="14" fill="#2a2f3a"/><text x="484" y="393" font-family="sans-serif" font-size="14" fill="#f1f5f9">And to update just that input?</text><g transform="translate(250 426) scale(0.4375)"><defs><linearGradient id="cg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cg2)"/><rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".18"/><g fill="none" stroke="#fff" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.2"><ellipse cx="32" cy="32" rx="16" ry="7"/><ellipse cx="32" cy="32" rx="16" ry="7" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="16" ry="7" transform="rotate(120 32 32)"/></g></g><text x="292" y="444" font-family="sans-serif" font-size="14" xml:space="preserve"><tspan fill="#e2e8f0">Use </tspan><tspan fill="#93c5fd">nix flake update nixpkgs</tspan><tspan fill="#e2e8f0"> — it only</tspan></text><text x="292" y="466" font-family="sans-serif" font-size="14" fill="#e2e8f0">refreshes the named input and leaves others pinned.</text><rect x="260" y="540" width="490" height="50" rx="25" fill="#262b36"/><text x="284" y="570" font-family="sans-serif" font-size="14" fill="#64748b">Message ChatGPT</text><circle cx="722" cy="565" r="16" fill="#e2e8f0"/><path d="M722 573v-15m-6 6l6-6 6 6" stroke="#11141b" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>
