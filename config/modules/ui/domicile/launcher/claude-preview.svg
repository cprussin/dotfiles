<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 640" width="800" height="640"><rect x="0" y="0" width="800" height="640" rx="0" fill="#07090d"/><defs><linearGradient id="bgw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0916f" stop-opacity=".22"/><stop offset=".6" stop-color="#9a4426" stop-opacity="0"/></linearGradient></defs><rect x="0" y="0" width="800" height="640" rx="0" fill="url(#bgw)"/><rect x="24" y="24" width="752" height="592" rx="12" fill="#262220" stroke="#ffffff" stroke-opacity=".08"/><path d="M24 36a12 12 0 0 1 12-12h728a12 12 0 0 1 12 12v24H24z" fill="#1a1e27"/><circle cx="46" cy="42" r="6" fill="#ff5f57"/><circle cx="66" cy="42" r="6" fill="#febc2e"/><circle cx="86" cy="42" r="6" fill="#28c840"/><g transform="translate(350 32) scale(0.3125)"><defs><linearGradient id="tw" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0916f"/><stop offset="1" stop-color="#9a4426"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#tw)"/><rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".18"/><g stroke="#fff" stroke-linecap="round" stroke-width="4"><path d="M32 32l0 -17" transform="rotate(0 32 32)"/><path d="M32 32l0 -12" transform="rotate(30 32 32)"/><path d="M32 32l0 -17" transform="rotate(60 32 32)"/><path d="M32 32l0 -12" transform="rotate(90 32 32)"/><path d="M32 32l0 -17" transform="rotate(120 32 32)"/><path d="M32 32l0 -12" transform="rotate(150 32 32)"/><path d="M32 32l0 -17" transform="rotate(180 32 32)"/><path d="M32 32l0 -12" transform="rotate(210 32 32)"/><path d="M32 32l0 -17" transform="rotate(240 32 32)"/><path d="M32 32l0 -12" transform="rotate(270 32 32)"/><path d="M32 32l0 -17" transform="rotate(300 32 32)"/><path d="M32 32l0 -12" transform="rotate(330 32 32)"/></g><circle cx="32" cy="32" r="5" fill="#fff"/></g><text x="378" y="47" font-family="sans-serif" font-size="14" fill="#e2e8f0" font-weight="600">Claude</text><g transform="translate(372 84) scale(0.875)"><defs><linearGradient id="cl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0916f"/><stop offset="1" stop-color="#9a4426"/></linearGradient></defs><rect x="2" y="2" width="60" height="60" rx="14" fill="url(#cl)"/><rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".18"/><g stroke="#fff" stroke-linecap="round" stroke-width="4"><path d="M32 32l0 -17" transform="rotate(0 32 32)"/><path d="M32 32l0 -12" transform="rotate(30 32 32)"/><path d="M32 32l0 -17" transform="rotate(60 32 32)"/><path d="M32 32l0 -12" transform="rotate(90 32 32)"/><path d="M32 32l0 -17" transform="rotate(120 32 32)"/><path d="M32 32l0 -12" transform="rotate(150 32 32)"/><path d="M32 32l0 -17" transform="rotate(180 32 32)"/><path d="M32 32l0 -12" transform="rotate(210 32 32)"/><path d="M32 32l0 -17" transform="rotate(240 32 32)"/><path d="M32 32l0 -12" transform="rotate(270 32 32)"/><path d="M32 32l0 -17" transform="rotate(300 32 32)"/><path d="M32 32l0 -12" transform="rotate(330 32 32)"/></g><circle cx="32" cy="32" r="5" fill="#fff"/></g><text x="400" y="170" font-family="sans-serif" font-size="26" fill="#f5ede6" font-weight="600" text-anchor="middle">Good afternoon, Connor</text><rect x="430" y="200" width="320" height="58" rx="14" fill="#3a332e"/><text x="444" y="223" font-family="sans-serif" font-size="14" fill="#f5ede6">Can you help me outline a talk</text><text x="444" y="243" font-family="sans-serif" font-size="14" fill="#f5ede6">about Wayland compositors?</text><g transform="translate(60 290) scale(.4)"><g stroke="#e0916f" stroke-linecap="round" stroke-width="4"><path d="M32 32l0 -17" transform="rotate(0 32 32)"/><path d="M32 32l0 -12" transform="rotate(30 32 32)"/><path d="M32 32l0 -17" transform="rotate(60 32 32)"/><path d="M32 32l0 -12" transform="rotate(90 32 32)"/><path d="M32 32l0 -17" transform="rotate(120 32 32)"/><path d="M32 32l0 -12" transform="rotate(150 32 32)"/><path d="M32 32l0 -17" transform="rotate(180 32 32)"/><path d="M32 32l0 -12" transform="rotate(210 32 32)"/><path d="M32 32l0 -17" transform="rotate(240 32 32)"/><path d="M32 32l0 -12" transform="rotate(270 32 32)"/><path d="M32 32l0 -17" transform="rotate(300 32 32)"/><path d="M32 32l0 -12" transform="rotate(330 32 32)"/></g><circle cx="32" cy="32" r="5" fill="#e0916f"/></g><text x="100" y="308" font-family="sans-serif" font-size="15" fill="#e7ddd4">Happy to. Here is a structure for a 30 minute talk:</text><text x="100" y="332" font-family="sans-serif" font-size="15" fill="#e7ddd4"></text><text x="100" y="356" font-family="sans-serif" font-size="15" fill="#e7ddd4">1.  Why Wayland: the X11 security model</text><text x="100" y="380" font-family="sans-serif" font-size="15" fill="#e7ddd4">2.  Protocols, surfaces and buffers</text><text x="100" y="404" font-family="sans-serif" font-size="15" fill="#e7ddd4">3.  Building a compositor: input, output, damage</text><text x="100" y="428" font-family="sans-serif" font-size="15" fill="#e7ddd4">4.  Live demo and lessons learned</text><text x="100" y="452" font-family="sans-serif" font-size="15" fill="#e7ddd4"></text><text x="100" y="476" font-family="sans-serif" font-size="15" fill="#e7ddd4">Want me to draft speaker notes for each section?</text><rect x="80" y="520" width="640" height="76" rx="16" fill="#2d2825" stroke="#5c4d44"/><text x="100" y="550" font-family="sans-serif" font-size="15" fill="#8f8178">Reply to Claude…</text><rect x="672" y="556" width="32" height="28" rx="8" fill="#c96442"/><path d="M688 577v-14m-5 5l5-5 5 5" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>
